name: Update News Feed

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and convert RSS to JSON
        run: |
          node -e '
          const fs = require("fs");
          async function getNews() {
            const queries = [
              "Russia OR Ukraine war",
              "Middle East OR Israel OR Gaza OR Lebanon OR Iran OR Yemen OR Houthis"
            ];
            let allArticles = [];
            
            for (const q of queries) {
              const url = `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=en-US&gl=US&ceid=US:en`;
              const res = await fetch(url);
              const xml = await res.text();
              
              // Simple regex parser for RSS items
              const itemRegex = /<item>([\s\S]*?)<\/item>/g;
              let match;
              while ((match = itemRegex.exec(xml)) !== null) {
                const itemContent = match[1];
                const title = (itemContent.match(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/) || [])[1] || "No Title";
                const link = (itemContent.match(/<link>(.*?)<\/link>/) || [])[1] || "#";
                const pubDate = (itemContent.match(/<pubDate>(.*?)<\/pubDate>/) || [])[1] || "";
                const source = (itemContent.match(/<source[^>]*>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/source>/) || [])[1] || "Google News";
                
                allArticles.push({ title, link, pubDate, author: source });
              }
            }
            fs.writeFileSync("news.json", JSON.stringify(allArticles, null, 2));
          }
          getNews();
          '

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update news.json" && git push)
